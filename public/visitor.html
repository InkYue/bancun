<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#160d0c" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>甜蜜礼物单</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page-visitor">
    <button id="musicToggle" class="volume-button" type="button" aria-label="开启背景音乐" aria-pressed="false">
      <span aria-hidden="true">🔇</span>
    </button>

    <main class="page-shell" id="pageShell" hidden>
      <section class="hero-card" aria-labelledby="brandName">
        <div class="hero-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="hero-avatar" id="heroAvatar" hidden>
          <img id="heroAvatarImg" alt="" />
        </div>
        <p class="eyebrow" id="brandLabel">Sweet Gift Ceremony</p>
        <h1 id="brandName">半寸时光</h1>
        <p class="subtitle" id="employeeName">主页</p>
        <p class="hero-intro" id="heroIntro" hidden></p>
        <div class="ribbon">* 最终解释权归半寸时光所有 *</div>
        <button id="customerLogout" class="customer-logout" type="button" aria-label="退出登录">⎋ 退出</button>
      </section>

      <section class="gift-board" aria-labelledby="giftBoardTitle">
        <div class="section-title">
          <span class="butterfly">✦</span>
          <h2 id="giftBoardTitle">普通礼物</h2>
          <span class="butterfly">✦</span>
        </div>
        <div id="normalGiftGrid" class="gift-grid"></div>
        <div id="premiumGiftGrid" class="gift-grid gift-grid-boxed"></div>
        <p class="crown-note">赠送以上 4 项任一礼物，即可获得专属冠名卡一张</p>

        <div class="section-title special-title">
          <span class="butterfly">✦</span>
          <h2>特殊礼物</h2>
          <span class="butterfly">✦</span>
        </div>
        <div id="specialGiftGrid" class="gift-grid gift-grid-boxed"></div>
        <p class="crown-note">赠送以上 4 项任一礼物，即可获得动态专属冠名卡一张</p>
      </section>

      <section class="payment-panel" aria-labelledby="paymentTitle">
        <p class="eyebrow">游客送礼</p>
        <h2 id="paymentTitle">输入金额，通过易支付付款</h2>
        <label class="amount-field" for="amountInput">
          <span>礼物金额（元）</span>
          <input id="amountInput" inputmode="numeric" autocomplete="off" placeholder="例如 520" />
        </label>
        <p id="matchHint" class="match-hint">输入金额后会自动匹配对应礼物，也可直接点上方礼物。</p>
        <button id="payButton" class="primary-button" type="button">去支付</button>
      </section>
    </main>

    <!-- 手机号登录遮罩 -->
    <div id="loginGate" class="login-gate" hidden>
      <div class="login-gate-card" role="dialog" aria-labelledby="gateTitle">
        <p class="eyebrow">Visitor Sign-In</p>
        <h2 id="gateTitle">用手机号进入</h2>
        <p class="login-tip" id="gateTip">请输入您的中国大陆手机号</p>

        <label class="login-field" for="phoneInput">
          <span>手机号</span>
          <input id="phoneInput" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel-national" placeholder="13800138000" />
          <em id="phoneError" class="field-error" hidden></em>
        </label>

        <label class="login-field" id="codeFieldWrap" hidden>
          <span>短信验证码</span>
          <div class="code-field">
            <input id="codeInput" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位数字" />
            <button id="sendCodeButton" class="ghost-button" type="button">获取验证码</button>
          </div>
          <em id="codeError" class="field-error" hidden></em>
        </label>

        <button id="loginButton" class="primary-button" type="button">进入</button>
        <p class="login-hint" id="gateHint">您的手机号将作为送礼记录的身份标识</p>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/visitor.js"></script>
  </body>
</html>
